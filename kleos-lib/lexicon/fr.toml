schema_version = 1
language = "fr"

# French baseline lexicon for the kleos-lib intelligence pipeline.
# Patch 38 Livrable 1 -- premiere langue cible apres l'anglais. Couvre les
# memes classes que en.toml pour permettre l'iteration multi-lang en
# Livrable 2 (refactor extraction.rs, personality.rs, etc.).

[classes.verb_like]
words = ["aimer", "adorer", "apprecier", "preferer", "kiffer"]

[classes.verb_dislike]
words = ["detester", "hair", "ne pas aimer", "ne pas supporter"]

[classes.verb_buy]
words = ["acheter", "achete", "achetee", "achetes", "achetees", "acquis", "commande", "recu"]

[classes.state_verbs]
words = ["est", "suis", "es", "sont", "etait", "etaient", "a", "ai", "as", "avons", "avez", "ont", "habite", "habites", "habitons", "habitez", "habitent", "travaille", "travailles", "travaillons", "travaillez", "travaillent", "devient", "deviens", "devenons", "commence", "demenage"]

[classes.articles]
words = ["le", "la", "les", "un", "une", "des", "du", "de", "mon", "ma", "mes", "ton", "ta", "tes", "son", "sa", "ses", "notre", "votre", "leur"]

[classes.stopwords]
words = ["et", "ou", "mais", "donc", "car", "que", "qui", "dont", "ce", "cette", "ces", "a", "de", "du", "des", "en", "sur", "sous", "dans", "par", "pour", "avec", "ont", "etaient", "leur", "leurs", "ils", "elles", "ete", "propos", "lequel", "laquelle", "quel", "quelle", "serait", "pourrait", "devrait", "alors", "quand", "quoi", "aussi"]

[classes.first_person_pronoun]
words = ["je", "j'", "j'ai", "moi", "me", "m'"]

[classes.emotion_happy]
words = ["heureux", "heureuse", "joyeux", "joyeuse"]
valence = 1.0
intensity = 0.6

[classes.emotion_excited]
words = ["excite", "excitee", "enthousiaste", "impatient", "impatiente"]
valence = 1.0
intensity = 0.8

[classes.emotion_grateful]
words = ["reconnaissant", "reconnaissante", "redevable"]
valence = 1.0
intensity = 0.7

[classes.emotion_proud]
words = ["fier", "fiere"]
valence = 1.0
intensity = 0.7

[classes.emotion_relieved]
words = ["soulage", "soulagee", "rassure", "rassuree"]
valence = 1.0
intensity = 0.5

[classes.emotion_thrilled]
words = ["enchante", "enchantee", "ravi", "ravie", "comble", "comblee"]
valence = 1.0
intensity = 0.9

[classes.emotion_content]
words = ["content", "contente", "satisfait", "satisfaite"]
valence = 1.0
intensity = 0.5

[classes.emotion_sad]
words = ["triste", "abattu", "abattue", "depite", "depitee"]
valence = -1.0
intensity = 0.6

[classes.emotion_angry]
words = ["en_colere", "furieux", "furieuse", "irrite", "irritee", "enrage", "enragee"]
valence = -1.0
intensity = 0.8

[classes.emotion_frustrated]
words = ["frustre", "frustree", "exaspere", "exasperee"]
valence = -1.0
intensity = 0.7

[classes.emotion_anxious]
words = ["anxieux", "anxieuse", "inquiet", "inquiete", "nerveux", "nerveuse"]
valence = -1.0
intensity = 0.6

[classes.emotion_stressed]
words = ["stresse", "stressee", "tendu", "tendue"]
valence = -1.0
intensity = 0.7

[classes.emotion_disappointed]
words = ["decu", "decue", "decourage", "decouragee"]
valence = -1.0
intensity = 0.6

[classes.emotion_overwhelmed]
words = ["depasse", "depassee", "submerge", "submergee"]
valence = -1.0
intensity = 0.8

[classes.emotion_lonely]
words = ["seul", "seule", "solitaire", "isole", "isolee"]
valence = -1.0
intensity = 0.7

[classes.emotion_worried]
words = ["soucieux", "soucieuse", "preoccupe", "preoccupee"]
valence = -1.0
intensity = 0.5

[classes.emotion_bored]
words = ["ennuye", "ennuyee", "blase", "blasee"]
valence = -1.0
intensity = 0.4

[classes.intensifier_weakening]
# multiplier 0.5
words = ["a_peine", "presque_pas"]

[classes.intensifier_softening]
# multiplier 0.6
words = ["doucement", "mollement"]

[classes.intensifier_attenuating]
# multiplier 0.7
words = ["un_peu", "quelque_peu", "plutot", "legerement", "modere"]

[classes.intensifier_strong]
# multiplier 1.3
words = ["vraiment", "tres", "fort", "totalement", "completement", "profondement", "fortement", "hautement"]

[classes.intensifier_very_strong]
# multiplier 1.4
words = ["absolument", "extremement", "incroyablement"]

[classes.negation_marker]
words = ["non", "pas", "jamais", "aucun", "aucune", "ni", "sans", "n_est_pas", "n_a_pas", "n_etait_pas", "ne_va_pas"]

[classes.causal_strong]
words = ["cause par", "resulte de", "resulte en", "provoque par", "du fait de", "a cause de", "en raison de", "grace a", "declenche"]

[classes.causal_context]
words = ["apres", "suite a", "compte tenu de", "etant donne", "depuis", "parce que", "donc", "par consequent"]

[classes.causal_weak]
# Voir en.toml: melange likelihood + verbes d action causale (broke/fixed equivalent FR).
words = ["peut-etre", "possiblement", "probablement", "pourrait", "casse", "repare"]

[classes.filler_prefixes]
words = ["euh", "ben", "alors", "donc", "voila", "tu sais", "en fait", "honnetement", "je veux dire", "bref", "bon"]

[classes.meta_stoplist]
words = ["en tant qu IA", "je suis une IA", "je ne peux pas", "je n ai pas", "en tant que modele de langage", "je ne suis pas en mesure", "je m excuse", "pour clarifier", "pour resumer", "en conclusion", "laisse moi expliquer", "comme je l ai dit", "en resume", "comme nous en avons parle", "pour etre clair", "pour le contexte", "passons", "a propos", "au fait"]

[classes.credential_keywords]
words = ["mot de passe", "mot_de_passe", "secret", "api_key", "apikey", "jeton", "token", "bearer", "autorisation", "credential", "cle_privee", "cle_ssh", "client_secret"]

[classes.prohibition_marker]
words = ["interdit", "interdite", "prohibe", "prohibee", "non autorise", "refuse", "bloque", "restreint", "ne doit pas", "ne peut pas", "jamais", "ne pas", "banni"]
