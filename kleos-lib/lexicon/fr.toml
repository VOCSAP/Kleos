schema_version = 1
language = "fr"

# French baseline lexicon for the kleos-lib intelligence pipeline.
# Patch 38 Livrable 2 normalize: the runtime matcher folds inputs and
# lexicon entries through lowercase + Unicode-NFD diacritic strip +
# optional Snowball stemming (lexicon::fold_for_matching). The TOML
# can therefore carry the orthographically-correct French forms with
# their proper accents -- the matcher reconciles user input that
# omits accents or uses inflected forms (aimer / aimee / aimait).

[classes.verb_like]
words = ["aimer", "adorer", "apprécier", "préférer", "kiffer"]

[classes.verb_dislike]
words = ["détester", "haïr", "ne pas aimer", "ne pas supporter"]

[classes.verb_buy]
words = ["acheter", "acheté", "achetée", "achetés", "achetées", "acquis", "commandé", "reçu"]

[classes.state_verbs]
# Grammar class -- short forms not suitable for stemming.
stem = false
words = ["est", "suis", "es", "sont", "était", "étaient", "a", "ai", "as", "avons", "avez", "ont", "habite", "habites", "habitons", "habitez", "habitent", "travaille", "travailles", "travaillons", "travaillez", "travaillent", "devient", "deviens", "devenons", "commence", "déménage"]

[classes.articles]
# Grammar class -- short tokens not stemmable.
stem = false
words = ["le", "la", "les", "un", "une", "des", "du", "de", "mon", "ma", "mes", "ton", "ta", "tes", "son", "sa", "ses", "notre", "votre", "leur"]

[classes.stopwords]
# Grammar class -- whole-token equality only.
stem = false
words = ["et", "ou", "mais", "donc", "car", "que", "qui", "dont", "ce", "cette", "ces", "à", "de", "du", "des", "en", "sur", "sous", "dans", "par", "pour", "avec", "ont", "étaient", "leur", "leurs", "ils", "elles", "été", "propos", "lequel", "laquelle", "quel", "quelle", "serait", "pourrait", "devrait", "alors", "quand", "quoi", "aussi"]

[classes.first_person_pronoun]
# Grammar class -- pronouns are not stemmable.
stem = false
words = ["je", "j'", "j'ai", "moi", "me", "m'"]

[classes.emotion_happy]
words = ["heureux", "heureuse", "joyeux", "joyeuse"]
valence = 1.0
intensity = 0.6

[classes.emotion_excited]
words = ["excité", "excitée", "enthousiaste", "impatient", "impatiente"]
valence = 1.0
intensity = 0.8

[classes.emotion_grateful]
words = ["reconnaissant", "reconnaissante", "redevable"]
valence = 1.0
intensity = 0.7

[classes.emotion_proud]
words = ["fier", "fière"]
valence = 1.0
intensity = 0.7

[classes.emotion_relieved]
words = ["soulagé", "soulagée", "rassuré", "rassurée"]
valence = 1.0
intensity = 0.5

[classes.emotion_thrilled]
words = ["enchanté", "enchantée", "ravi", "ravie", "comblé", "comblée"]
valence = 1.0
intensity = 0.9

[classes.emotion_content]
words = ["content", "contente", "satisfait", "satisfaite"]
valence = 1.0
intensity = 0.5

[classes.emotion_sad]
words = ["triste", "abattu", "abattue", "dépité", "dépitée"]
valence = -1.0
intensity = 0.6

[classes.emotion_angry]
words = ["en colère", "furieux", "furieuse", "irrité", "irritée", "enragé", "enragée"]
valence = -1.0
intensity = 0.8

[classes.emotion_frustrated]
words = ["frustré", "frustrée", "exaspéré", "exaspérée"]
valence = -1.0
intensity = 0.7

[classes.emotion_anxious]
words = ["anxieux", "anxieuse", "inquiet", "inquiète", "nerveux", "nerveuse"]
valence = -1.0
intensity = 0.6

[classes.emotion_stressed]
words = ["stressé", "stressée", "tendu", "tendue"]
valence = -1.0
intensity = 0.7

[classes.emotion_disappointed]
words = ["déçu", "déçue", "découragé", "découragée"]
valence = -1.0
intensity = 0.6

[classes.emotion_overwhelmed]
words = ["dépassé", "dépassée", "submergé", "submergée"]
valence = -1.0
intensity = 0.8

[classes.emotion_lonely]
words = ["seul", "seule", "solitaire", "isolé", "isolée"]
valence = -1.0
intensity = 0.7

[classes.emotion_worried]
words = ["soucieux", "soucieuse", "préoccupé", "préoccupée"]
valence = -1.0
intensity = 0.5

[classes.emotion_bored]
words = ["ennuyé", "ennuyée", "blasé", "blasée"]
valence = -1.0
intensity = 0.4

[classes.intensifier_weakening]
# multiplier 0.5. Grammar-like adverbs -- no stemming.
stem = false
words = ["à peine", "presque pas"]

[classes.intensifier_softening]
# multiplier 0.6
stem = false
words = ["doucement", "mollement"]

[classes.intensifier_attenuating]
# multiplier 0.7
stem = false
words = ["un peu", "quelque peu", "plutôt", "légèrement", "modéré"]

[classes.intensifier_strong]
# multiplier 1.3
stem = false
words = ["vraiment", "très", "fort", "totalement", "complètement", "profondément", "fortement", "hautement"]

[classes.intensifier_very_strong]
# multiplier 1.4
stem = false
words = ["absolument", "extrêmement", "incroyablement"]

[classes.negation_marker]
# Grammar class -- contractions and short particles, no stemming.
stem = false
words = ["non", "pas", "jamais", "aucun", "aucune", "ni", "sans", "n'est pas", "n'a pas", "n'était pas", "ne va pas"]

[classes.causal_strong]
words = ["causé par", "résulte de", "résulte en", "provoqué par", "du fait de", "à cause de", "en raison de", "grâce à", "déclenché"]

[classes.causal_context]
words = ["après", "suite à", "compte tenu de", "étant donné", "depuis", "parce que", "donc", "par conséquent"]

[classes.causal_weak]
# Voir en.toml: mélange likelihood + verbes d action causale (broke/fixed équivalent FR).
words = ["peut-être", "possiblement", "probablement", "pourrait", "cassé", "réparé"]

[classes.filler_prefixes]
words = ["euh", "ben", "alors", "donc", "voilà", "tu sais", "en fait", "honnêtement", "je veux dire", "bref", "bon"]

[classes.meta_stoplist]
words = ["en tant qu'IA", "je suis une IA", "je ne peux pas", "je n'ai pas", "en tant que modèle de langage", "je ne suis pas en mesure", "je m'excuse", "pour clarifier", "pour résumer", "en conclusion", "laisse-moi expliquer", "comme je l'ai dit", "en résumé", "comme nous en avons parlé", "pour être clair", "pour le contexte", "passons", "à propos", "au fait"]

[classes.credential_keywords]
# Technical tokens -- stemming would distort api_key, clé_ssh, etc.
stem = false
words = ["mot de passe", "mot_de_passe", "secret", "api_key", "apikey", "jeton", "token", "bearer", "autorisation", "credential", "clé_privée", "clé_ssh", "client_secret"]

[classes.decision_verbs]
# Phrases introduisant une décision ou un choix d'action.
stem = false
words = ["décidé de", "choisi de", "vais", "suis passé à", "suis passée à", "opté pour", "pris", "est allé avec", "ai pris"]

[classes.identity_markers]
# Phrases introduisant une revendication d'identité.
stem = false
words = ["suis un", "suis une", "me considère comme", "m'identifie comme", "me définis comme"]

[classes.value_markers]
# Phrases signalant une valeur ou une croyance personnelle.
stem = false
words = ["important pour moi", "compte pour moi", "je crois en", "je valorise", "je tiens à"]

[classes.motivation_markers]
# Phrases signalant une motivation ou un objectif.
stem = false
words = ["je veux", "mon objectif est", "j'aspire à", "j'essaie de", "j'espère", "je vise à", "je souhaite"]

[classes.favorite_marker]
# Marqueurs d'introduction "mon préféré", "ma préférée", etc.
stem = false
words = ["préféré", "préférée", "préférés", "préférées", "favori", "favorite", "favoris", "favorites"]

[classes.favorite_category]
# Catégories qui suivent "mon X préféré".
stem = false
words = ["plat", "film", "livre", "série", "jeu", "chanson", "couleur", "sport", "endroit", "boisson", "artiste", "groupe", "auteur", "nourriture"]

[classes.is_or_are]
# Copule utilisée dans le motif favorite_regex.
stem = false
words = ["est", "sont"]

[classes.location_verbs]
# Phrases introduisant un changement ou un état de localisation.
stem = false
words = ["déménagé à", "déménagé vers", "habite à", "vis à", "vis en", "reste à", "installé à", "installée à"]

[classes.role_verbs]
# Phrases introduisant un nouveau rôle ou poste.
stem = false
words = ["commencé", "débuté", "promu", "travaille maintenant comme", "suis maintenant", "viens de devenir", "promue"]

